# OmniVision OV5647 MIPI CSI-2 camera sensor
CONFIG_I2C=y
CONFIG_MEDIA_SUPPORT=y
CONFIG_MEDIA_CAMERA_SUPPORT=y
CONFIG_VIDEO_DEV=y
CONFIG_VIDEO_CAMERA_SENSOR=y
CONFIG_VIDEO_OV5647=y

# Media / display drivers
CONFIG_V4L_TEST_DRIVERS=y
CONFIG_VIDEO_IMX219=y
CONFIG_DRM_PANEL_SIMPLE=y

# USB Ethernet
CONFIG_USB_RTL8150=y
CONFIG_USB_RTL8152=y

# Promote the 802.11 stack to built-in so the drivers below can be =y
CONFIG_CFG80211=y
CONFIG_MAC80211=y

# Realtek Wi-Fi
CONFIG_RTL8187=y
CONFIG_RTL8187_LEDS=y
CONFIG_RTL_CARDS=y
CONFIG_RTL8XXXU=y
CONFIG_RTL8XXXU_UNTESTED=y

# TI Wi-Fi
CONFIG_WLCORE=y
CONFIG_WLCORE_SPI=y
CONFIG_WLCORE_SDIO=y
CONFIG_WL18XX=y
