name: Simulation

on: [push]

jobs:
  build:
    name: "Run test bench simulations"
    runs-on: rootless-docker
    container:
      image: registry.amd.com/aida/mini-isp-dev:latest
      options: --user root
      credentials:
        username: ${{ secrets.HARBOR_NAME }}
        password: ${{ secrets.HARBOR_SECRET }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Simulation
      run: make sim
    - name: Upload
      uses: actions/upload-artifact@v3
      with:
        name: Simulation artifacts
        path: |
          build/sim/**/*.png
          build/sim/**/*.pdf
          build/sim/**/*.xml
        retention-days: 1
