name: Linting and license check

on: [push]

jobs:
  pre-commit:
    name: "Run pre-commit lint"
    runs-on: rootless-docker
    container:
      image: registry.amd.com/aida/mini-isp-dev:latest
      options: --user root
      credentials:
        username: ${{ secrets.HARBOR_NAME }}
        password: ${{ secrets.HARBOR_SECRET }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Run lint
      run: make lint
