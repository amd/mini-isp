name: Linting and license check

on: [push]

jobs:
  pre-commit:
    name: "Run pre-commit lint"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/amd/mini-isp-dev:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Run lint
      run: make lint
