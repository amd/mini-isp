name: Build and push Docker image

on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Release tag for this image'
        required: true
        default: 'latest'
        type: string
      verible_version:
        description: 'Verible Version'
        required: true
        default: 'v0.0-4051-g9fdb4057'
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./docker/Dockerfile
          failure-threshold: warning
          override-info: DL3003,DL3008,DL3033,DL3041,DL3059,SC2016,SC2154

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base container image
        uses: docker/build-push-action@v4
        with:
          push: true
          context: .
          file: ./docker/Dockerfile
          build-args: |
            VERIBLE_VERSION=${{ inputs.verible_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
              ghcr.io/amd/mini-isp-dev:${{inputs.tag_version}}
